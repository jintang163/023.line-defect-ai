service:
  name: "image-capture-service"
  version: "1.0.0"
  port: 8080
  metrics_port: 9090
  log_level: "INFO"

trigger:
  gpio_pin: 17
  debounce_ms: 50
  simulation_mode: false
  enable_ptp: true
  hardware_trigger_mode: "parallel"
  trigger_output_pins: [18, 19, 20]
  simulation_interval_sec: 2.0

cameras:
  - camera_id: "cam-top-001"
    position: "top"
    type: "basler"
    serial_number: "22456789"
    exposure_us: 5000
    gain_db: 0.0
    width: 2448
    height: 2048
    pixel_format: "BayerRG8"
    trigger_mode: "hardware"
    trigger_source: "Line1"
    ip_address: "192.168.1.101"

  - camera_id: "cam-bottom-001"
    position: "bottom"
    type: "basler"
    serial_number: "22456790"
    exposure_us: 5000
    gain_db: 0.0
    width: 2448
    height: 2048
    pixel_format: "BayerRG8"
    trigger_mode: "hardware"
    trigger_source: "Line1"
    ip_address: "192.168.1.102"

  - camera_id: "cam-side-001"
    position: "side"
    type: "basler"
    serial_number: "22456791"
    exposure_us: 8000
    gain_db: 2.0
    width: 2448
    height: 2048
    pixel_format: "BayerRG8"
    trigger_mode: "hardware"
    trigger_source: "Line1"
    ip_address: "192.168.1.103"

lighting:
  controller_type: "modbus"
  modbus_host: "192.168.1.200"
  modbus_port: 502
  modbus_slave_id: 1
  allow_mock_fallback: false
  channels:
    - channel: 1
      name: "top_light"
      mode: "strobe"
      default_brightness: 80
      default_color_temp: 5500

    - channel: 2
      name: "bottom_light"
      mode: "strobe"
      default_brightness: 80
      default_color_temp: 5500

    - channel: 3
      name: "side_light"
      mode: "constant"
      default_brightness: 60
      default_color_temp: 6500

  presets:
    metal:
      brightness: 85
      color_temp: 6500
      mode: "strobe"
    glass:
      brightness: 50
      color_temp: 4000
      mode: "constant"
    plastic:
      brightness: 70
      color_temp: 5000
      mode: "strobe"

preprocessing:
  enable: true
  bayer_conversion: true
  bayer_pattern: "RG"
  distortion_correction: true
  camera_matrix: [[2300, 0, 1224], [0, 2300, 1024], [0, 0, 1]]
  distortion_coeffs: [-0.2, 0.1, 0.0, 0.0, 0.0]
  roi_crop:
    enable: false
    x: 100
    y: 100
    width: 2248
    height: 1848
  resize:
    enable: false
    target_width: 1224
    target_height: 1024

buffer:
  size: 100
  max_workers: 4

local_cache:
  enable: true
  directory: "./data/cache"
  max_disk_gb: 50
  retry_interval_sec: 30
  retry_max_attempts: 10

messaging:
  type: "rabbitmq"
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  exchange: "line-defect-exchange"
  queue: "image-capture-queue"
  routing_key: "image.captured"
  compression: true
  quality: 85
  embed_images_in_mq: false

  image_storage:
    type: "minio"
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "defect-images"
    use_ssl: false
    use_local_fallback: true
    local_fallback_dir: "./data/storage"

redis:
  host: "localhost"
  port: 6379
  db: 0
  password: ""
  stream_name: "line-defect-images"
  max_stream_length: 10000

monitoring:
  enable_prometheus: true
  metrics_port: 9090
  health_check_interval_sec: 5
  alert_webhook_url: ""
  alert_email: ""

api:
  host: "0.0.0.0"
  port: 8080
  enable_cors: true
  docs_enable: true

metadata:
  line_id: "line-001"
  station_id: "station-001"
  factory_id: "factory-001"
