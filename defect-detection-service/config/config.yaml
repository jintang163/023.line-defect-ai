service:
  name: "defect-detection-service"
  version: "1.0.0"
  log_level: "INFO"

detection:
  products_config: "./config/products.yaml"
  models_dir: "./models"
  default_backend: "onnx_cpu"
  gpu_device_id: 0
  enable_tensorrt: false
  inference_timeout_ms: 100
  enable_annotation: true
  save_annotated_images: false
  annotated_images_dir: "./data/annotated"

messaging:
  type: "rabbitmq"
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  exchange: "line-defect-exchange"
  input_queue: "image-capture-queue"
  input_routing_key: "image.captured"
  output_queue: "defect-result-queue"
  output_routing_key: "defect.result"

  kafka:
    input_topic: "image-capture-topic"
    output_topic: "defect-result-topic"
    group_id: "defect-detection-group"

  image_fetch_timeout: 10
  image_fetch_retries: 3
  image_fetch_retry_delay: 1

  process_all_cameras: true
  camera_position_filter: []
  camera_id_filter: []

  auto_switch_product: true

  enable_parallel_processing: true
  max_parallel_workers: 4

  image_storage:
    type: "minio"
    endpoint: "localhost:9000"
    access_key: "minioadmin"
    secret_key: "minioadmin"
    bucket: "defect-images"
    use_ssl: false
    use_local_fallback: true
    local_fallback_dir: "./data/storage"

alert:
  consecutive_ng_threshold: 5
  auto_stop_line: true
  webhook_url: ""
  email_notification: false
  smtp_server: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  notification_email: ""

plc:
  enable: false
  type: "modbus_tcp"
  host: "192.168.1.100"
  port: 502
  slave_id: 1
  reject_coil_address: 100
  stop_line_coil_address: 101
  alarm_coil_address: 102
  reset_coil_address: 103
  heartbeat_coil_address: 104
  defect_code_register: 200
  pulse_duration_ms: 500
  command_timeout_ms: 3000
  max_retries: 3
  retry_delay_ms: 1000

action_log:
  enable: true
  max_memory_logs: 10000
  enable_file_logging: true
  enable_database_logging: false
  enable_influxdb_logging: false
  log_file_path: "./data/action_logs.jsonl"
  sqlite_db_path: "./data/action_logs.db"
  influxdb:
    host: "localhost"
    port: 8086
    username: ""
    password: ""
    database: "defect_logs"

production:
  enable: true
  snapshot_interval_count: 1000
  consecutive_ng_threshold: 10
  max_snapshots_per_product: 1000
  enable_database_persistence: true
  sqlite_db_path: "./data/yield_snapshots.db"
  enable_api_upload: false
  api_upload_url: ""
  api_upload_timeout_ms: 5000

manual_override:
  max_history: 10000

monitoring:
  enable_prometheus: true
  metrics_port: 9091
  health_check_interval_sec: 5
  enable_tracing: false
  jaeger_endpoint: ""

api:
  host: "0.0.0.0"
  port: 8081
  enable_cors: true
  docs_enable: true
  max_image_size_mb: 10

metadata:
  line_id: "line-001"
  station_id: "station-001"
  factory_id: "factory-001"
